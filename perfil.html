<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil | Vertex</title>

<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<div class="navbar">

<div class="logo">VERTEX</div>

<nav>

<a href="index.html">Inicio</a>
<a href="/index.html#servicios">Servicios</a>
<a href="/index.html#planes">Planes</a>
<a href="/index.html#contacto">Contacto</a>
<a href="perfil.html" class="active-link">Perfil</a>

</nav>

<a href="/index.html" class="btn-nav">
Volver
</a>

</div>

</header>

<section class="perfil-container">

<div class="perfil-card">

<div class="profile-avatar">
<i class="fa-regular fa-user"></i>
</div>

<h1>Crear Perfil</h1>

<form id="profileForm">

<input
type="text"
id="businessName"
placeholder="Nombre del emprendimiento"
required>

<textarea
id="businessDesc"
placeholder="Descripción del emprendimiento"
required>
</textarea>

<input
type="text"
id="phone"
placeholder="Teléfono">

<input
type="url"
id="website"
placeholder="Sitio web">

<input
type="url"
id="instagram"
placeholder="Instagram">

<input
type="url"
id="facebook"
placeholder="Facebook">

<input
type="url"
id="whatsapp"
placeholder="WhatsApp">

<input
type="file"
id="bannerInput"
accept="image/*">

<button type="submit">

Guardar Perfil

</button>

</form>

</div>

</section>

<section
id="previewSection"
class="business-preview hidden">

<div class="preview-card">

<img
id="previewBanner"
src="https://via.placeholder.com/1200x400"
alt="Banner">

<div class="preview-content">

<h2 id="previewName">

Tu emprendimiento

</h2>

<p id="previewDescription">

Aquí aparecerá la descripción.

</p>

<a href="#" class="preview-btn">

Ver más

</a>

<div class="preview-socials">

<a id="siteLink" href="#">
<i class="fa-solid fa-globe"></i>
</a>

<a id="igLink" href="#">
<i class="fa-brands fa-instagram"></i>
</a>

<a id="fbLink" href="#">
<i class="fa-brands fa-facebook"></i>
</a>

<a id="waLink" href="#">
<i class="fa-brands fa-whatsapp"></i>
</a>

</div>

</div>

</div>

</section>

<footer>

<div class="footer-left">

<h3>VERTEX</h3>

<p>
Impulsando el crecimiento de emprendedores mediante innovación digital.
</p>

</div>

<div class="footer-icons">

<i class="fa-brands fa-instagram"></i>
<i class="fa-brands fa-facebook"></i>
<i class="fa-brands fa-whatsapp"></i>
<i class="fa-regular fa-envelope"></i>

</div>

</footer>

<script src="perfil.js"></script>


<!-- NOTIFICACION -->

<div id="toast" class="toast hidden">

<i id="toastIcon" class="fa-solid fa-circle-check"></i>

<div class="toast-content">

<h4 id="toastTitle">Éxito</h4>

<p id="toastMessage">
Acción realizada correctamente.
</p>

</div>

</div>

</body>
</html>
